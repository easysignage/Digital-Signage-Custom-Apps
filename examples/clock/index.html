<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clock</title>
    <!--
      Full-screen clock and date. Works fully offline.

      Optional player tags:
        tags.clock_format = "12" or "24"   (default 24)
        tags.greeting     = text under the date, e.g. "Welcome to Level 3"
        tags.theme        = "dark" (default), "light" or "contrast"
        tags.accent       = a hex colour for the greeting and AM/PM, e.g. "#ff6a00"

      Preview:
        index.html?name=Lobby&tags.clock_format=12&tags.greeting=Welcome&tags.accent=%23ff6a00
    -->
    <link rel="stylesheet" href="theme.css" />
    <style>
      #time {
        font-size: calc(var(--u) * 24);
        font-weight: var(--weight-regular);
        line-height: 1;
        /* Equal-width digits so the clock doesn't shift every second. */
        font-variant-numeric: tabular-nums;
      }
      #ampm {
        font-size: var(--text-xl);
        font-weight: var(--weight-bold);
        margin-left: var(--space-2);
        color: var(--accent);
      }
      #date { margin-top: var(--space-3); font-size: var(--text-lg); }
      #greeting { margin-top: var(--space-6); color: var(--accent); font-weight: var(--weight-bold); }
    </style>
  </head>
  <body>
    <main class="screen center">
      <div><span id="time"></span><span id="ampm"></span></div>
      <p id="date" class="muted"></p>
      <p id="greeting"></p>
    </main>

    <script src="easysignage.js"></script>
    <script src="theme.js"></script>
    <script src="clock.js"></script>
  </body>
</html>
