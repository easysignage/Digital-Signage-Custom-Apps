<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Countdown</title>
    <!--
      Countdown to an event. Set the target per screen with player tags, so one
      package can count down to different events in different places.

      Player tags:
        tags.event_name = "Grand Opening"
        tags.event_date = "2026-12-01T09:00"   (device local time, YYYY-MM-DDTHH:MM)
        tags.done_text  = text shown once the time is reached (default "It's here!")

      Preview:
        index.html?tags.event_name=Grand%20Opening&tags.event_date=2026-12-01T09:00
    -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="event"></h1>
    <div id="units">
      <div class="unit"><span id="d" class="num">0</span><span class="label">Days</span></div>
      <div class="unit"><span id="h" class="num">00</span><span class="label">Hours</span></div>
      <div class="unit"><span id="m" class="num">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span id="s" class="num">00</span><span class="label">Seconds</span></div>
    </div>
    <p id="done"></p>

    <script src="easysignage.js"></script>
    <script src="countdown.js"></script>
  </body>
</html>
